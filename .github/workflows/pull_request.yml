name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Fetch the merge commit and its parents. The first parent is the base branch.
          fetch-depth: 2

      - name: Select the newest release of Xcode 26
        run: |
          ls -ld /Applications/Xcode*
          # Beta and release candidate app names contain letters, so this pattern skips them.
          # A new Xcode major version on the image does not change CI until a PR changes this pattern.
          app=$(printf '%s\n' /Applications/Xcode_26.*.app | grep -E '^/Applications/Xcode_26(\.[0-9]+)+\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$app" ]; then
            echo "::error::This runner has no release of Xcode 26."
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          swift format --version

      - name: Lint the Swift files that this pull request changes
        # Main does not pass this lint yet, so check only the changed files.
        run: |
          git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.swift' > "$RUNNER_TEMP/swift-files"
          echo "Swift files that this pull request changes:"
          cat "$RUNNER_TEMP/swift-files"
          if [ -s "$RUNNER_TEMP/swift-files" ]; then
            xargs swift format lint --strict --configuration .swift-format < "$RUNNER_TEMP/swift-files"
          fi
