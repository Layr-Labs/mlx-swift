title: "Layr-Labs/mlx-swift - mlx-swift fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx-swift`](https://github.com/Layr-Labs/mlx-swift), a fork of
  [`ml-explore/mlx-swift`](https://github.com/ml-explore/mlx-swift) — the Swift layer of Layr-Labs'
  Apple-silicon inference stack &middot; created with [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx-swift
  url: https://github.com/ml-explore/mlx-swift
  # The upstream commit this fork sits on. CI (`scripts/check_forkdiff.py`)
  # requires this to equal `git merge-base HEAD upstream/main`, so a rebase
  # onto newer upstream fails the gate until the hash — and the sections
  # below — are brought up to date. Upstream main as of 2026-06-17.
  hash: e23ae6b2cf96737bbd31a34ed304123162f8c409
fork:
  name: Layr-Labs/mlx-swift
  url: https://github.com/Layr-Labs/mlx-swift
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx-swift"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx-swift`](https://github.com/Layr-Labs/mlx-swift),
    a fork of [`ml-explore/mlx-swift`](https://github.com/ml-explore/mlx-swift).

    The fork is the Swift layer of Layr-Labs' Apple-silicon inference stack —
    [`mlx`](https://github.com/Layr-Labs/mlx) → [`mlx-c`](https://github.com/Layr-Labs/mlx-c) →
    **`mlx-swift`** → [`mlx-swift-lm`](https://github.com/Layr-Labs/mlx-swift-lm). Most of what it
    does is expose the forked core's kernels, allocator accounting and diagnostics to Swift, so the
    continuous-batching engine in `mlx-swift-lm` can drive them. Upstream behaviour is otherwise
    kept intact; every change is meant to be additive and rebasable.

    Two kinds of change appear below, and the sections say which is which:

    - **Hand-written Swift** in `Source/MLX*` and `Tests/` — new APIs and fixes authored here.
    - **Regenerated / repinned vendor content** — the `Source/Cmlx/mlx` and `Source/Cmlx/mlx-c`
      submodules repointed at the Layr-Labs forks, the C headers mirrored from them, and the
      embedded JIT Metal sources regenerated by `tools/update-mlx.sh`. These are large by line
      count but carry no hand-written logic of their own; the logic lives in the pinned forks.
  sub:
    - title: "Vendored core: submodules and package wiring"
      description: |
        The `Cmlx` target vendors MLX and MLX-C as git submodules. The fork repoints both at the
        Layr-Labs forks (upstream did not define the C symbols the Swift surface below calls, so
        `main` failed to link until this) and bumps them through MLX 0.32.0 (M5 `_nax` Neural
        Accelerator path) and 0.32.2 (GQA-8 decode KV reuse, long-context attention), then on to
        the fork commits carrying the expert-tile, `qmv_wide`, GPT-OSS MXFP4 and allocator work.
      sub:
        - title: "Submodule pins"
          description: |
            `.gitmodules` points `Source/Cmlx/mlx` and `Source/Cmlx/mlx-c` at
            `Layr-Labs/mlx` / `Layr-Labs/mlx-c`; the gitlinks are advanced with each core change.
            The diff shown for the two submodule paths is the pointer change only.
          globs:
            - ".gitmodules"
            - "Source/Cmlx/mlx"
            - "Source/Cmlx/mlx-c"
        - title: "Package manifest and Xcode project"
          description: |
            `Package.swift` exposes `Cmlx` as a public library product (so downstream Swift, e.g.
            a distributed provider, can link the C API directly), compiles the `mlx-c`
            distributed wrappers, and wires the JACCL real-backend sources in through a
            compile-time conditional — deviating from upstream's "do not build distributed
            support (yet)". The Xcode project and xcconfig pick up the new Swift files and
            headers; `tools/update-mlx*.sh` regenerate the embedded sources against the pinned
            forks.
          globs:
            - "Package.swift"
            - "Source/Cmlx/mlx-conditional/jaccl_conditional.cpp"
            - "xcode/**"
            - "tools/update-mlx.sh"
            - "tools/update-mlx-xcodeproj.sh"
    - title: "C headers mirrored from the pinned forks"
      description: |
        `Source/Cmlx/include/**` and `Source/Cmlx/include-framework/**` are the MLX / MLX-C
        headers as seen by SwiftPM and by the framework build. They are regenerated from the
        submodule pins, so their diff is upstream 0.32.x drift plus the fork's additions: the
        Gemma 4 expert-QMM diagnostics (`gemma4_expert_qmm.h`), allocator footprint and
        resource-count accessors, `graph_utils`, thread-unsafe stream constructors,
        `mutable_inputs` on custom Metal kernels, and the `ParallelFileReader` batch size raised
        from 32 MiB to 128 MiB (`mlx-io-load.h`) to cut lock contention when loading multi-GiB
        safetensors shards.
      globs:
        - "Source/Cmlx/include/**"
        - "Source/Cmlx/include-framework/**"
    - title: "Regenerated JIT Metal sources"
      description: |
        `Source/Cmlx/mlx-generated/**` is the embedded copy of MLX's Metal kernels that the
        runtime JIT compiles from. It must move with the core pin — updating only a metallib
        leaves the JIT source inconsistent — so every kernel change in the `mlx` fork
        (qmv_wide, the E=256 expert-tile route, GPT-OSS MXFP4, FP32 SDPA partials, quantized bias
        sums, segmented NAX GEMM, searchsorted/gemv/dot additions from upstream 0.32) shows up
        here as regenerated text. No hand edits; the corresponding dispatch mirrors
        (`quantized.cpp`, `steel_*.cpp`) are regenerated alongside.
      globs:
        - "Source/Cmlx/mlx-generated/**"
    - title: "Swift runtime surface"
      description: Hand-written changes in `Source/MLX`, `Source/MLXFast` and `Source/MLXNN`.
      sub:
        - title: "Memory accounting and allocation footprint"
          description: |
            `Memory.numResources` / `Memory.resourceLimit` expose the Metal buffer *count* (the
            `[metal::malloc] Resource limit (499000) exceeded` failure is count exhaustion, not
            byte OOM — freed buffers recycle into a size-keyed cache trimmed only by bytes).
            `AllocationFootprint` adds coherent accounting snapshots and checked footprint
            policy from the forked allocator so a serving engine can budget KV and weights
            against real numbers.
          globs:
            - "Source/MLX/Memory.swift"
            - "Source/MLX/AllocationFootprint.swift"
        - title: "Process-global default streams"
          description: |
            MLX 0.32 made the default stream's Metal command encoder thread-local, so any
            `async/await` caller that built a graph on one thread and evaluated it on another
            aborted with "There is no Stream(gpu, N) in current thread". `Stream.gpu` /
            `Stream.cpu` now return one process-global stream per device created through the
            fork's `mlx_thread_unsafe_*_stream_new`, whose encoder lives in the global map.
          globs:
            - "Source/MLX/Stream.swift"
            - "Source/MLX/Device.swift"
        - title: "EvalProbe and eval-lock ordering"
          description: |
            `EvalProbe` is measurement-only instrumentation bracketing the blocking `mlx_eval`
            inside `evalLock`: writes happen under the lock (recursion-safe via a depth counter),
            reads are lock-free, so a provider can report "the current eval has been running
            11 s" — the first-token wedge smoking gun — even while a wedged eval holds the lock
            forever. `Transforms+Compile` fixes a compiled-function lock-order inversion found
            during verification, and `MLXArray.description` is wrapped in `evalLock`.
          globs:
            - "Source/MLX/EvalProbe.swift"
            - "Source/MLX/Transforms+Eval.swift"
            - "Source/MLX/Transforms+Compile.swift"
            - "Source/MLX/MLXArray.swift"
        - title: "GPU diagnostics: Gemma 4 expert-QMM route counters"
          description: |
            `GPU.Gemma4ExpertQMMDiagnostics` with snapshot / reset / arm / disarm wraps the fork's
            `mlx_metal_gemma4_expert_qmm_diagnostics*` so the sorted expert-QMM route (and its
            fallbacks) can be measured at engine-idle boundaries without an mlx-c release.
          globs:
            - "Source/MLX/GPU+Metal.swift"
        - title: "Quantized constant reuse"
          description: |
            Quantized inference rebuilt BF16→FP32 conversions of unchanged scales, offsets and
            biases on every call. `ConstantArrayCastCache` keeps bounded per-constant entries
            keyed on the backing descriptor (so `Module.update`, indexed assignment and
            compile-state replacement invalidate correctly, and allocator ABA can't alias),
            leaving U8 MXFP4 scales untouched and the reflected parameter tree unchanged.
            `MLX_QUANTIZED_CONSTANT_CACHE=0` restores the original path.
            A private, default-off Bonsai profile permits exact FP16→FP32
            widening reuse for eligible 2-bit/group128/block1024 Hadamard
            projections; all other callers retain the BF16-only contract.
          globs:
            - "Source/MLX/ConstantArrayCastCache.swift"
            - "Source/MLXNN/Quantized.swift"
        - title: "Bonsai packed signed-Hadamard layers"
          description: |
            Prism-compatible signed block-Hadamard transforms, packed affine
            linear layers and inverse-transformed embedding lookup preserve the
            published rotated checkpoint representation. Transforms use FP32
            intermediates and restore the incoming dtype; explicit signs and
            packed geometry are validated without unfolding or requantizing.
            Adapted from PrismML-Eng/mlx-swift under its MIT attribution.
          globs:
            - "Source/MLXNN/Hadamard.swift"
        - title: "Custom Metal kernels: mutable inputs"
          description: |
            Swift custom Metal kernels take a default-empty `mutableInputs` list, forwarded
            through the C API, declaring Metal write access on owned input buffers and
            forbidding implicit contiguous copies of them (needed by the Nemotron kernels).
          globs:
            - "Source/MLX/MLXFastKernel.swift"
            - "Source/MLXFast/MLXFastKernel.swift"
        - title: "Upstream API drift absorbed"
          description: |
            `FFT` gains the `FFTNorm` parameter and `IO` follows the load/save signatures of
            the regenerated MLX-C bindings.
          globs:
            - "Source/MLX/FFT.swift"
            - "Source/MLX/IO.swift"
    - title: "Tests"
      description: |
        Coverage for the new Swift surface and for the forked kernels as reached from Swift:
        allocation footprint and resource counts, constant-cast cache invalidation, EvalProbe,
        GPT-OSS MXFP4 decode-tail and kernel correctness, quantized bias accumulation, the
        Qwen E=256 expert-tile route (performance-shaped), and sorted-gather quantized matmul.
      globs:
        - "Tests/MLXTests/*.swift"
    - title: "Fork tooling"
      description: |
        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash`
        is not the merge-base with upstream, or when a file the fork changes is not described
        by a section above.
      globs:
        - "scripts/check_forkdiff.py"
        - "FORKDIFF.md"
        - "README.md"

# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/**"
