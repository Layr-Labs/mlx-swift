name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: [self-hosted, macOS, ARM64, darkbloom-macos-arm64-4x16]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Fetch the merge commit and its parents. The first parent is the base branch.
          fetch-depth: 2

      - name: Start the resource sampler
        # Report-only (.github/scripts/ci-resource-sampler.py): every 5 s it
        # samples memory and busy vCPUs. It never fails the job.
        run: python3 .github/scripts/ci-resource-sampler.py start "$RUNNER_TEMP/resource-samples"

      - name: Select Xcode 27.2
        uses: ./.github/actions/select-xcode

      - name: Show the swift-format version
        run: swift format --version

      - name: Check the format of the Swift files that this pull request changes
        # Main does not pass this check yet, so check only the changed files.
        # Like pre-commit, format the files in place. Then fail if git sees a change.
        run: |
          echo "Swift files that this pull request changes:"
          git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.swift'
          git diff -z --name-only --diff-filter=d HEAD^1 HEAD -- '*.swift' \
            | xargs -0 swift format format --in-place --configuration .swift-format
          if ! git diff --exit-code; then
            echo "::error::swift-format changed the files above. Run swift format format --in-place --configuration .swift-format on them and push the result."
            exit 1
          fi

      - name: Report the resource samples
        # Prints the peaks that size this job (FORKDIFF.md, Job sizes). Report-only.
        if: ${{ always() }}
        run: python3 .github/scripts/ci-resource-sampler.py report "$RUNNER_TEMP/resource-samples" || true
