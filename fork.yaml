title: "Layr-Labs/mlx-swift - mlx-swift fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx-swift`](https://github.com/Layr-Labs/mlx-swift), a fork of
  [`ml-explore/mlx-swift`](https://github.com/ml-explore/mlx-swift) — the Swift layer of Layr-Labs'
  Apple-silicon inference stack &middot; created with [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx-swift
  url: https://github.com/ml-explore/mlx-swift
  # The upstream commit this fork sits on. CI (`scripts/check_forkdiff.py`)
  # requires this to equal `git merge-base HEAD upstream/main`. Each merge of
  # upstream moves this hash, and the sections below must then match again.
  # Upstream main ce46846 of 2026-10-22, merged into the fork on 2026-10-22.
  hash: ce4684631d840d9cbf8dea636749b8c068e1d6ae
fork:
  name: Layr-Labs/mlx-swift
  url: https://github.com/Layr-Labs/mlx-swift
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx-swift"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx-swift`](https://github.com/Layr-Labs/mlx-swift),
    a fork of [`ml-explore/mlx-swift`](https://github.com/ml-explore/mlx-swift).

    The fork is the Swift layer of Layr-Labs' Apple-silicon inference stack —
    [`mlx`](https://github.com/Layr-Labs/mlx) → [`mlx-c`](https://github.com/Layr-Labs/mlx-c) →
    **`mlx-swift`** → [`mlx-swift-lm`](https://github.com/Layr-Labs/mlx-swift-lm). Most of what it
    does is expose the forked core's kernels, allocator accounting and diagnostics to Swift, so the
    continuous-batching engine in `mlx-swift-lm` can drive them. Upstream behaviour is otherwise
    kept intact; every change is meant to be additive and rebasable.

    Two kinds of change appear below, and the sections say which is which:

    - **Hand-written Swift** in `Source/MLX*` and `Tests/` — new APIs and fixes authored here.
    - **Regenerated / repinned vendor content** — the `Source/Cmlx/mlx` and `Source/Cmlx/mlx-c`
      submodules repointed at the Layr-Labs forks, the C headers mirrored from them, and the
      embedded JIT Metal sources regenerated by `tools/update-mlx.sh`. These are large by line
      count but carry no hand-written logic of their own; the logic lives in the pinned forks.
  sub:
    - title: "Vendored core: submodules and package wiring"
      description: |
        The `Cmlx` target vendors MLX and MLX-C as git submodules. The fork repoints both at the
        Layr-Labs forks (upstream did not define the C symbols the Swift surface below calls, so
        `main` failed to link until this) and bumps them through MLX 0.32.0 (M5 `_nax` Neural
        Accelerator path) and 0.32.2 (GQA-8 decode KV reuse, long-context attention), then on to
        the fork commits carrying the expert-tile, `qmv_wide`, GPT-OSS MXFP4 and allocator work.
      sub:
        - title: "Submodule pins"
          description: |
            `.gitmodules` points `Source/Cmlx/mlx` and `Source/Cmlx/mlx-c` at
            `Layr-Labs/mlx` / `Layr-Labs/mlx-c`; the gitlinks are advanced with each core change.
            The diff shown for the two submodule paths is the pointer change only.
            Both pins are merges of upstream `main` into the forks (2026-10-22). The `mlx` pin
            keeps the core compiler-capacity retry for 512- and 1024-thread Metal groups. The
            `mlx-c` pin has the upstream C API that upstream mlx-swift calls and the fork's
            own C API. The pins are `mlx` cb73247a and `mlx-c` 44763458, whose CMake
            `GIT_TAG` names the same `mlx` commit.
          globs:
            - ".gitmodules"
            - "Source/Cmlx/mlx"
            - "Source/Cmlx/mlx-c"
        - title: "Package manifest and Xcode project"
          description: |
            `Package.swift` exposes `Cmlx` as a public library product, so downstream Swift
            (for example a distributed provider) can link the C API directly. It excludes the
            vendored `mlx-c/tests` programs from library source discovery, because each one
            defines `main()`. `MLX_VERSION` is 0.32.2 to match the pinned core, in `Package.swift`
            and in the Xcode configuration. The `MLXTests` target depends on `MLXLinalg`, so a
            test can call the deprecated `MLXLinalg.triInv`. The Xcode project lists the
            mirrored `gemma4_expert_qmm.h` header. The non-CUDA builds also exclude
            `cusolver_utils.cpp` and the Windows-only `wddm.cpp`, which the pinned core adds
            under `backend/cuda`. Upstream builds JACCL, the ring backend and
            the distributed C API itself since its 2026-10 merges, so the fork no longer changes
            that wiring.
            `tools/fix-metal-includes.sh` also copies `gather_mm_offsets.metal`,
            `gated_delta_update.metal`, `gated_delta_update_vjp.metal` and
            `scaled_dot_product_attention_vjp.metal`, so the SwiftPM `default.metallib` carries
            those kernels. The pinned core loads them by name with no JIT fallback. The script does not copy `fence.metal`: upstream builds `fence` only at
            Metal 3.2 or newer, and this package targets macOS 14.0 (Metal 3.1). Thus the
            SwiftPM `default.metallib` has no `fence` kernels, and `MLX_METAL_FAST_SYNCH=1`
            needs a metallib built at Metal 3.2 or newer, such as the CMake full-AOT
            `mlx.metallib`. `tools/update-mlx-xcodeproj.sh` mirrors the Gemma 4 expert-QMM
            diagnostics header into `include-framework` and keeps its C-mode `MLX_API`
            fallback.
          globs:
            - "Package.swift"
            - "xcode/**"
            - "tools/fix-metal-includes.sh"
            - "tools/update-mlx-xcodeproj.sh"
    - title: "C headers mirrored from the pinned forks"
      description: |
        `Source/Cmlx/include/**` and `Source/Cmlx/include-framework/**` are the MLX / MLX-C
        headers as seen by SwiftPM and by the framework build. They are regenerated from the
        submodule pins, so their diff is upstream 0.32.x drift plus the fork's additions: the
        Gemma 4 expert-QMM diagnostics (`gemma4_expert_qmm.h`), allocator footprint and
        resource-count accessors, `graph_utils`, thread-unsafe stream constructors,
        `mutable_inputs` on custom Metal kernels, and the `ParallelFileReader` batch size raised
        from 32 MiB to 128 MiB (`mlx-io-load.h`) to cut lock contention when loading multi-GiB
        safetensors shards.
      globs:
        - "Source/Cmlx/include/**"
        - "Source/Cmlx/include-framework/**"
    - title: "Regenerated JIT Metal sources"
      description: |
        `Source/Cmlx/mlx-generated/**` is the embedded copy of MLX's Metal kernels that the
        runtime JIT compiles from. It must move with the core pin — updating only a metallib
        leaves the JIT source inconsistent — so every kernel change in the `mlx` fork
        (qmv_wide, the E=256 expert-tile route, GPT-OSS MXFP4, FP32 SDPA partials, quantized bias
        sums, segmented NAX GEMM, searchsorted/gemv/dot additions from upstream 0.32) shows up
        here as regenerated text. Legacy and NAX quantized copies carry partial-tile
        bounds fixes; NAX matches the core's reverted inactive-group optimization.
        All four quantized loaders have distinct symbols to prevent AOT linkage
        from mixing incompatible affine/FP or legacy/NAX implementations.
        No hand edits; the corresponding dispatch mirrors
        (`quantized.cpp`, `steel_*.cpp`) are regenerated alongside.
        SortedGatherQuantizedTailTests checks exact expert projections, partial
        reduction/output tiles, packing widths and NaN rows across quantization modes.
      globs:
        - "Source/Cmlx/mlx-generated/**"
    - title: "Swift runtime surface"
      description: Hand-written changes in `Source/MLX`, `Source/MLXFast` and `Source/MLXNN`.
      sub:
        - title: "Memory accounting and allocation footprint"
          description: |
            `Memory.numResources` / `Memory.resourceLimit` expose the Metal buffer *count* (the
            `[metal::malloc] Resource limit (499000) exceeded` failure is count exhaustion, not
            byte OOM — freed buffers recycle into a size-keyed cache trimmed only by bytes).
            `AllocationFootprint` adds coherent accounting snapshots and checked footprint
            policy from the forked allocator so a serving engine can budget KV and weights
            against real numbers. `Memory+AllocationCap` exposes install-once Metal backing
            enforcement and coherent cap snapshots through the GLMCalibration SPI. The core
            owns page-aligned no-copy backing and returns credit only after its Metal
            deallocator releases the pages; host memory and driver overhead are not capped.
            The pinned core's footprint policy includes a VM-page minimum before
            cache-reuse allowance for positive requests, covering page-backed
            subpage buffers even for a policy captured before cap installation.
            ALLOCATION-CAP.md distinguishes this per-buffer bound from cap credit
            and host/OS budgets; zero and overflow handling remain unchanged.
          globs:
            - "Source/MLX/Memory.swift"
            - "Source/MLX/AllocationFootprint.swift"
            - "Source/MLX/Memory+AllocationCap.swift"
            - "ALLOCATION-CAP.md"
            - "tools/check-process-allocation-cap.sh"
        - title: "EvalProbe and serialized native evaluation"
          description: |
            `EvalProbe` is measurement-only instrumentation of the free `eval`. It brackets
            the schedule under `evalLock` and the wait after it, so a provider can report
            "the current eval has been running 11 s", which identifies a first-token wedge.
            Array reads reach the same bracket through `MLXArray.eval()`. The probe state has
            its own short lock, and readers never take `evalLock`. The `Execution` SPI
            `withSerializedEvaluation` runs a body under `evalLock`, so status-checking native
            evaluation and fences cannot commit the global Metal command buffer during a
            model evaluation. Upstream fixed the compiled-function lock order itself, so the
            fork no longer changes `Transforms+Compile.swift`.
          globs:
            - "Source/MLX/EvalProbe.swift"
            - "Source/MLX/Transforms+Eval.swift"
            - "Tests/MLXTests/NativeEvaluationSerializationTests.swift"
        - title: "GPU diagnostics: Gemma 4 expert-QMM route counters"
          description: |
            `GPU.Gemma4ExpertQMMDiagnostics` with snapshot / reset / arm / disarm wraps the fork's
            `mlx_metal_gemma4_expert_qmm_diagnostics*` so the sorted expert-QMM route (and its
            fallbacks) can be measured at engine-idle boundaries without an mlx-c release.
          globs:
            - "Source/MLX/GPU+Metal.swift"
        - title: "Ops: roll over more than one axis"
          description: |
            `roll(_:shift:axes:)` passed one shift value for all the axes, and MLX raised an error
            when there were two or more axes. It now passes the shift once for each axis, as Python
            `mx.roll` does for an integer shift. `RollMultipleAxesTests` covers it.
          globs:
            - "Source/MLX/Ops.swift"
        - title: "Quantized constant reuse"
          description: |
            Quantized inference rebuilt BF16→FP32 conversions of unchanged scales, offsets and
            biases on every call. `ConstantArrayCastCache` keeps bounded per-constant entries
            keyed on the backing descriptor (so `Module.update`, indexed assignment and
            compile-state replacement invalidate correctly, and allocator ABA can't alias),
            leaving U8 MXFP4 scales untouched and the reflected parameter tree unchanged.
            `MLX_QUANTIZED_CONSTANT_CACHE=0` restores the original path.
            The default-on eligible Bonsai profile permits exact FP16→FP32
            widening reuse for eligible 2-bit/group128/block1024 Hadamard
            projections; explicit `DARKBLOOM_BONSAI_F16_CONSTANT_CACHE=0`
            restores the prior path. Other callers retain the BF16-only contract.
          globs:
            - "Source/MLX/ConstantArrayCastCache.swift"
            - "Source/MLXNN/Quantized.swift"
        - title: "Linalg: free triInv passes upper"
          description: |
            The free function `triInv(_:upper:stream:)` did not pass `upper` on to
            `MLXLinalg.triInv`, so it always read the lower triangle. It now passes it on, as
            `MLXLinalg.triInv` and upstream MLX `linalg.tri_inv` do. The deprecated twin in the
            `MLXLinalg` module (`Source/MLXLinalg/Linalg.swift`) had the same defect and now
            also passes `upper`. `LinalgTriInvTests` and `LinalgDeprecatedTriInvTests` cover
            both. The `MLXTests` target now depends on `MLXLinalg` (`Package.swift`) so that
            the test can call the deprecated function.
          globs:
            - "Source/MLX/Linalg.swift"
            - "Source/MLXLinalg/Linalg.swift"
        - title: "Bonsai packed signed-Hadamard layers"
          description: |
            Prism-compatible signed block-Hadamard transforms, packed affine
            linear layers and inverse-transformed embedding lookup preserve the
            published rotated checkpoint representation. Transforms use FP32
            intermediates and restore the incoming dtype; explicit signs and
            packed geometry are validated without unfolding or requantizing.
            Adapted from PrismML-Eng/mlx-swift under its MIT attribution.
          globs:
            - "Source/MLXNN/Hadamard.swift"
        - title: "Activations: deprecated SoftMax axis"
          description: |
            The deprecated `SoftMax` layer called `softmax(x)` with no axis, so it normalized
            over all elements. It is renamed to `Softmax`, which uses the last axis, as Python
            `nn.Softmax` does. `SoftMax` now uses the last axis too. `SoftMaxAxisTests` covers it.
          globs:
            - "Source/MLXNN/Activations.swift"
        - title: "Custom Metal kernels: mutable inputs and explicit math modes"
          description: |
            Swift custom Metal kernels take a default-empty `mutableInputs` list, forwarded
            through the C API, declaring Metal write access on owned input buffers and
            forbidding implicit contiguous copies of them (needed by the Nemotron kernels).
            `MLXFast.KernelMathMode` adds an explicit per-kernel safe, relaxed or fast
            compiler mode. The default remains safe and retains the legacy constructors;
            non-safe modes use the new C options entry point and need numerical qualification.
            Both the MLX and compatibility MLXFast APIs retain mutable-input semantics.
          globs:
            - "Source/MLX/MLXFastKernel.swift"
            - "Source/MLXFast/MLXFastKernel.swift"
        - title: "Ops: gatherQuantizedMM global scale"
          description: |
            The pinned `mlx-c` adds a `global_scale` argument to `mlx_gather_qmm` (upstream
            `mlx-c` 0.32.4). `gatherQuantizedMM` passes it through as an optional
            `globalScale` parameter, which NVFP4 uses. The default is `nil`, so existing
            callers do not change.
          globs:
            - "Source/MLX/Ops.swift"
            - "Source/MLX/Documentation.docc/Organization/arithmetic.md"
        - title: "Ops: nanToNum defaults for float64 and complex64"
          description: |
            Upstream now gives `posInf` and `negInf` a default of `nil`, which gives the largest
            finite value of the dtype. The C++ default supports only float32, float16 and
            bfloat16 and throws for other types. So for `float64` and `complex64` the Swift
            function passes the largest finite `Float` explicitly. The values are `Float`, so for
            `float64` the default is 3.4028235e38, not the largest finite `Double`.
            `NanToNumDefaultsTests` covers float32, float64 and complex64.
          globs:
            - "Source/MLX/Ops.swift"
        - title: "Transformer: post-norm decoder cross-attention queries"
          description: |
            In the post-norm `TransformerDecoderLayer` (`normFirst: false`), the cross attention
            took its queries from the self-attention output before the residual sum and `ln1`.
            It now takes them from the normalized sum `x`, as upstream MLX does.
            `TransformerDecoderLayerTests` covers it.
          globs:
            - "Source/MLXNN/Transformer.swift"
        - title: "GPU: thread-scoped command-buffer commit limits"
          description: |
            `GPU.withCommandBufferLimits(_:_:)` (with `GPU.CommandBufferLimits`) wraps the fork's
            `mlx_metal_set_thread_command_buffer_limits` (header
            `Source/Cmlx/include/mlx/command_buffer_limits.h`): command buffers encoded on the
            calling thread commit after the given operation count or megabytes of distinct
            inputs instead of the device defaults, and the previous limits are restored on exit.
            A caller can give single-token decode steps larger buffers, so the CPU encodes
            further ahead of the GPU, while prefill keeps the defaults and their memory bound.
            Partitioning work into command buffers does not change results.
          globs:
            - "Source/MLX/GPU+Metal.swift"
            - "Source/Cmlx/include/mlx/command_buffer_limits.h"
    - title: "Tests"
      description: |
        Coverage for the new Swift surface and for the forked kernels as reached from Swift:
        allocation footprint and resource counts, constant-cast cache invalidation, EvalProbe,
        GPT-OSS MXFP4 decode-tail and kernel correctness, quantized bias accumulation, the
        Qwen E=256 expert-tile route (performance-shaped), and sorted-gather quantized matmul.
        `ArrayAccessorTests`, `IndexingFormsTests`, `NestedStructureTests`, `EvalGradOverloadTests`,
        `MemoryLimitTests` and `ErrorHandlerScopeTests` cover `MLXArray` reads and conversions, the
        subscript forms, nested structures, the eval and grad overloads, the memory limits and the
        scoped and global error handlers.
        `LossCoverageTests`, `ActivationCoverageTests`, `QuantizedLayerTests` and
        `UpsampleCoverageTests` cover each MLXNN loss, activation, quantized layer and upsample
        mode, compared with values from plain Swift loops.
        `LinalgCoverageTests`, `RandomCoverageTests`, `FactoryCoverageTests`, `DTypeCoverageTests`,
        `ParameterTypesCoverageTests` and `ArrayAtCoverageTests` cover the linalg factorizations
        and norms, the random samplers, the array factories, `DType` and type promotion, the
        parameter types and the `.at[...]` update operations.
        `OpsCoverageTests` and `MLXArrayOpsCoverageTests` call each free function, operator and
        method in `Ops.swift`, `Ops+Array.swift` and `MLXArray+Ops.swift` on small arrays and
        compare the results with values computed by hand or by plain Swift loops.
        `CustomFunctionTests`, `ConvolutionTransposedTests` and `CacheTests` cover custom
        functions with a custom VJP, the transposed convolution layers and the MLXNN cache, which
        had no tests.
        `TransformerTests` and `RecurrentLayerTests` cover the upstream Transformer, RNN, GRU and LSTM
        layers, which had no tests, against references built from plain ops.
        `CompileOverloadsTests` covers the typed `compile` overloads, which had no tests: each
        compiled result must equal the uncompiled result, and a second call must not trace again.
      globs:
        - "Tests/MLXTests/*.swift"
    - title: "Fork tooling"
      description: |
        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash`
        is not the merge-base with upstream, or when a file the fork changes is not described
        by a section above. `build-metallib.sh` builds the full MLX Metal library for the
        fork's test run in CI, because a SwiftPM command-line build compiles no Metal kernels.
        `check-generated-metal-sources.py` checks copied Metal headers and complete declared
        JIT sections against current nested core, with exact wrappers and source-hash receipts.
        Its default gate covers affine and FP quantized kernels, including NAX. `--all` audits the broader
        Metal tree and reports existing drift; it does not claim every generated source is
        current. Static section reconstruction does not replace compiler include discovery,
        full regeneration, or binary qualification. Mutation self-tests verify stale copied
        and expanded bodies fail. This gate does not regenerate files.
        CI coverage locates the MLX test-target bundle emitted by SwiftBuild or
        the combined package-test bundle emitted by native SwiftPM, and refuses
        a missing executable or profile before reporting instrumented Swift code.
        CONTRIBUTING.md documents the full-FP32 test contract and the required
        fresh-process allocation-cap check, distinct from the ordinary test pass.
      globs:
        - "scripts/check_forkdiff.py"
        - "scripts/check-generated-metal-sources.py"
        - "scripts/test-check-generated-metal-sources.py"
        - "scripts/build-metallib.sh"
        - "FORKDIFF.md"
        - "CONTRIBUTING.md"
        - "README.md"


# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/**"
